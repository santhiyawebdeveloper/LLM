# ACTIVE PRODUCTION CONFIGURATION
# Use this file for production deploys:
#   shopify app deploy -c lms --allow-updates
#
# Do NOT deploy shopify.app.toml (placeholder template for local dev).

client_id = "2836a433d92ea24f9977e98df209bb47"
name = "LMS"
application_url = "https://shopify-lms-three.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = "lms-development-store-cx9qoiqw.myshopify.com"

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products"
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify-lms-three.vercel.app/api/auth/callback",
  "http://localhost:3000/api/auth/callback"
]

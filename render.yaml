services:
  - type: web
    name: shopify-lms-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SHOPIFY_SCOPES
        value: read_products
      - key: MONGODB_URI
        sync: false
      - key: VITE_SHOPIFY_API_KEY
        sync: false
      - key: PORT
        value: 3000
